# Rotación de logs de TR2. Instalar en /etc/logrotate.d/tr2
# copytruncate: systemd (StandardOutput=append) y Laravel mantienen el archivo abierto;
# así no hace falta reiniciar servicios.
/home/tr2/htdocs/tr2.srv685835.hstgr.cloud/python-engine/logs/*.log
/home/tr2/htdocs/tr2.srv685835.hstgr.cloud/storage/logs/laravel.log {
    daily
    maxsize 50M
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root root
}
